services:
  - type: web
    name: greenlink-api
    runtime: node
    plan: free
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GREENLINK_DATABASE_URL
        sync: false
      - key: GREENLINK_ALLOWED_ORIGINS
        sync: false
      - key: GREENLINK_AUTH_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
